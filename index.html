function blankFacilities(){return Object.fromEntries(Object.keys(FACILITIES).map(k=>[k,{points:0,lastPointTick:Date.now(),active:null,after:null}]))}
function facilityLevel(key){return s.buildingLevels[FACILITIES[key].building]||0}
function facilityCap(key){let lv=facilityLevel(key);return lv>=10?150:lv>=5?100:lv>=3?75:50}
function facilityRate(key){let lv=facilityLevel(key);return 1/(300*(lv>=20?.4:lv>=15?.5:lv>=10?.6:lv>=5?.8:lv>=3?.9:1))}
function abilityBy(key,id){return FACILITIES[key].abilities.find(a=>a.id===id)}
function activeMods(){let out={};Object.entries(s.facilities||{}).forEach(([key,f])=>{if(f.active&&f.active.end>Date.now()){let a=abilityBy(key,f.active.id);Object.entries(a?.mods||{}).forEach(([k,v])=>out[k]=(out[k]??1)*v)}if(f.after&&f.after.end>Date.now())Object.entries(f.after.mods||{}).forEach(([k,v])=>out[k]=(out[k]??1)*v)});return out}
function mod(name){return activeMods()[name]??1}
function tickFacilities(now){Object.keys(FACILITIES).forEach(key=>{let f=s.facilities[key],lv=facilityLevel(key);if(!lv){f.lastPointTick=now;return}if(f.active&&f.active.end<=now){let a=abilityBy(key,f.active.id);if(a?.after)f.after={end:now+a.after.duration*1000,mods:Object.fromEntries(Object.entries(a.after).filter(([k])=>k!=='duration'))};f.active=null;toast(FACILITIES[key].name+'の効果が終了')}if(f.after&&f.after.end<=now)f.after=null;let regen=(f.after?.mods?.pointRegen===0)?0:facilityRate(key),elapsed=Math.max(0,(now-f.lastPointTick)/1000);f.points=Math.min(facilityCap(key),f.points+elapsed*regen);f.lastPointTick=now})}
function activateFacility(key,id){let f=s.facilities[key],a=abilityBy(key,id);if(!a||facilityLevel(key)<1)return;if(f.active)return toast('同じ施設では1つだけ発動できます');if(f.points<a.cost)return toast(FACILITIES[key].pointName+'が足りません');let preview=combinedPreview(a.mods),danger=Object.entries(preview).some(([k,v])=>['production','click'].includes(k)&&v<.25);if(danger&&!confirm('警告：主要な倍率が大幅に低下します。発動しますか？'))return;f.points-=a.cost;f.active={id:a.id,end:Date.now()+a.duration*1000};s.debugUsed=s.debugUsed;toast(a.name+'を発動');renderContent();save()}
function combinedPreview(extra){let m=activeMods();Object.entries(extra||{}).forEach(([k,v])=>m[k]=(m[k]??1)*v);return m}

function blankPollution(){return{stage:0,value:0,mode:'normal',everComplete:false,research:[],resonators:[],totalResonators:0,totalReturned:0,pulseReady:false,pulseAt:0,nextPulse:Date.now()+120000,lastSpawn:Date.now(),transition:null,seals:0,restarts:0,sealedSeconds:0,pollutedSeconds:0,logs:[],extraResearch:[]}}

function pollutionStrength(){if(!pollutionActive())return 0;if(s.pollution.mode==='restarting'&&s.pollution.transition){let p=1-(s.pollution.transition.end-Date.now())/s.pollution.transition.duration;return Math.max(.25,Math.min(1,p))}return 1}
function pollutionProductionMult(){if(!pollutionActive())return 1;let st=s.pollution.stage,str=pollutionStrength(),base=st===1?1.15:st===2?1.6:2.25;let research=1;if(pollutionOwned('superconductor'))research*=1.05;if(pollutionOwned('thought'))research*=1.2;if(pollutionOwned('unmanned'))research*=1.35;if(pollutionOwned('neural'))research*=1.5;if(pollutionOwned('acceptance'))research*=1.25;return 1+(base*research-1)*str}
